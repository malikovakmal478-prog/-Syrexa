services:
  - type: web
    name: syrexa
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --threads 8 --timeout 120
    healthCheckPath: /health
    disk:
      name: syrexa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/syrexa.db
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: REQUIRED_CHANNELS
        value: ""
